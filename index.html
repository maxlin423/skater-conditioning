    <button class="btn wide" id="expReport">Copy training report</button>
    <button class="btn ghost wide" id="expReportRaw" style="margin-top:8px">Save with full history</button>
    <p class="sub" style="margin:12px 0 0">${S.sessions.filter(s=>s.programId===S.activeProgram).length} sessions on ${esc(P.name)}.</p>
  </div>

  <div class="card">
    <h2>What you've got to train with</h2>
    <p class="sub" style="margin:6px 0 4px">Anything you can use — a jump rope, boxes and their heights, ankle weights, a slant board. Write it however you like. It goes to whoever builds your next program so they only prescribe things you actually have.</p>
    <textarea id="equip" placeholder="e.g. jump rope, 12 and 18 inch boxes, 2lb and 5lb ankle weights, slant board" aria-label="Equipment available">${esc(S.equipment||"")}</textarea>
    <button class="btn quiet wide" id="saveEquip" style="margin-top:8px">Save</button>
  </div>

  <div class="card">
    <h2>Training program</h2>
    <p class="sub" style="margin:6px 0 4px">Switching keeps everything — your sessions, badges and rotation meter carry across every program. Each program remembers its own phase and targets.</p>
    ${progList()}
    <button class="btn quiet wide" id="addProg" style="margin-top:12px">Add a program</button>
    <div id="pastePanel" class="hide" style="margin-top:10px">
      <textarea id="progJson" class="paste" placeholder="Paste the program JSON here" aria-label="Program JSON"></textarea>
      <button class="btn wide" id="doImport" style="margin-top:8px">Check and add</button>
      <div id="progMsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>Phase</h2>
    <p class="sub" style="margin:6px 0 12px">Currently Phase ${curPhase()}. Move down anytime if the work stops feeling controlled.</p>
    <div class="feels">
      ${PHASES.map(p=>`<button data-ph="${p.n}" class="${curPhase()===p.n?"on":""}">
        <span class="e mono">${p.n}</span><span class="l">${esc(p.name)}</span></button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Start over</h2>
    <p class="sub" style="margin:6px 0 12px">Erases every session, badge, and target on this device.</p>
    <button class="btn ghost wide" id="wipe">Erase everything</button>
  </div>

  <div class="card">
    <p class="sub" style="margin:0">This is general training guidance, not medical or coaching advice. Volume and jump work should be cleared with a skating coach or a trainer who works with young athletes — especially during a growth spurt.</p>
  </div>`;

  view$().querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.theme=b.dataset.th; save(); render(); });
  const stamp = ()=>new Date().toISOString().slice(0,10);
  document.getElementById("expReport").onclick=()=>{
    const json = JSON.stringify(buildExport(), null, 2);
    copyText(json, "Training report copied. Paste it to whoever is building your next program.");
  };
  document.getElementById("expReportRaw").onclick=()=>{
    const json = JSON.stringify(buildExport({raw:true}), null, 2);
    if(!downloadText("training-report-"+stamp()+".json", json))
      copyText(json, "Training report copied.");
  };

  document.getElementById("saveEquip").onclick=()=>{
    S.equipment = document.getElementById("equip").value.trim().slice(0,1000);
    save();
    const b=document.getElementById("saveEquip");
    b.textContent="Saved"; setTimeout(()=>{ b.textContent="Save"; },1200);
  };

  view$().querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>switchProgram(b.dataset.use));
  view$().querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.exp, json = programJSON(id);
    if(!json) return;
    downloadText(id+"-v"+(S.programs[id].def.version||"1")+".json", json);
    copyText(json, "Program copied, and saved as a file. Either one can be handed to whoever is building the next version.");
  });
  view$().querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.rm, nm = S.programs[id].def.name||id;
    const n = S.sessions.filter(s=>s.programId===id).length;
    if(!confirm(`Remove "${nm}"? Its phase and targets go with it.${n?` The ${n} session${n===1?"":"s"} you logged on it stay in your history.`:""}`)) return;
    delete S.programs[id];
    save(); renderSettings();
  });

  const addBtn = document.getElementById("addProg");
  const panel = document.getElementById("pastePanel");
  addBtn.onclick=()=>{
    panel.classList.toggle("hide");
    addBtn.textContent = panel.classList.contains("hide") ? "Add a program" : "Cancel";
    if(!panel.classList.contains("hide")) document.getElementById("progJson").focus();
  };
  document.getElementById("doImport").onclick=()=>{
    const box = document.getElementById("progJson");
    const msg = document.getElementById("progMsg");
    const raw = box.value.trim();
    const fail = list => { msg.innerHTML = `<ul class="errs">${list.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`; };
    if(!raw){ fail(["Nothing pasted yet."]); return; }

    let def;
    try{ def = JSON.parse(raw); }
    catch(e){ fail(["That isn't valid JSON — it may have been cut off in copying. ("+e.message+")"]); return; }

    const check = validateProgram(def);
    if(!check.ok){ fail(check.errors); return; }

    const existing = S.programs[def.id];
    if(existing){
      const from = existing.def.version, to = def.version;
      if(from === to && !confirm(`"${def.name}" v${to} is already installed. Re-import it? Your targets and phase are kept.`)) return;
      if(from !== to && !confirm(`Update "${def.name}" from v${from} to v${to}? Your targets and place in the program carry over.`)) return;
    }

    const res = installProgram(def);
    if(!res.ok){ fail(res.errors); return; }

    if(!existing && confirm(`Added "${res.name}". Switch to it now?`)) S.activeProgram = def.id;
    if(S.activeProgram === def.id){ refreshProgram(); showDisclaimerFor(def.id); }

    const lines = [];
    if(res.mode==="revision"){
      lines.push(`Updated to v${res.toVersion} from v${res.fromVersion}.`);
      if(res.note) lines.push(res.note);
      lines.push(`${res.carried} target${res.carried===1?"":"s"} carried over.`);
      if(res.reset.length) lines.push(`Reset to starting value: ${res.reset.join(", ")}.`);
      if(res.dropped.length) lines.push(`No longer in the program (history kept): ${res.dropped.join(", ")}.`);
    }else{
      lines.push(`Added "${res.name}".`);
    }
    (res.warnings||[]).forEach(w=>lines.push("Worth knowing: "+w));

    awardBadges(); save();
    box.value = "";
    render();
    alert(lines.join("\n\n"));
  };

  view$().querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ S.weeklyGoalOverride=+b.dataset.goal; save(); renderSettings(); });
  view$().querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{ setPhase(+b.dataset.ph); awardBadges(); save(); render(); });

  document.getElementById("copy").onclick=async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{
      await navigator.clipboard.writeText(code);
      alert("Backup code copied. Paste it into the other device.");
    }catch(e){
      window.prompt("Copy this code:", code);
    }
  };
  const mb=document.getElementById("meas");
  if(mb && motionSupported()) mb.onclick=async()=>{
    if(!S.measure.on){
      const perm = await askMotion();
      if(perm!=="granted"){
        alert(perm==="unsupported"
          ? "This device doesn't share motion data with web pages."
          : "Motion access was turned down. You can change it in your browser's site settings and try again.");
        return;
      }
    }
    S.measure.on=!S.measure.on; S.measure.seen=true; save(); renderSettings();
  };

  document.getElementById("paste").onclick=()=>importCode();

  view$().querySelectorAll("[data-metric]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.metric, inp=document.getElementById("m_"+id);
    const v=parseFloat(inp.value);
    if(!isFinite(v) || v<=0){ inp.focus(); return; }
    logMetric(id, Math.round(v*10)/10);
    S.metricSnooze = 0;
    save(); renderSettings();
  });

  const pn=document.getElementById("pname");
  const saveName=()=>{
    S.profile.name = pn.value.trim();
    const dob=document.getElementById("pdob");
    S.profile.dob = dob && dob.value ? dob.value : null;
    save();
    renderSettings();                       /* age line updates with the new DOB */
    const b=document.getElementById("saveName");
    b.textContent="Saved"; setTimeout(()=>{ const c=document.getElementById("saveName"); if(c) c.textContent="Save"; },1200);
  };
  document.getElementById("saveName").onclick=saveName;
  pn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); saveName(); } };
  document.getElementById("wipe").onclick=()=>{
    if(!confirm("Erase all sessions and progress on this device?")) return;
    if(!confirm("Last check — this can't be undone.")) return;
    S=ensurePrograms(blank()); refreshProgram(); save(); view="today"; render();
  };
}

/* ============ BOOT ============ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  if(S.active && !confirm("You have a session in progress. Leave it?")) return;
  if(S.active){ S.active=null; step=0; save(); }
  stopTimer(); view=b.dataset.go; render();
});
refreshProgram();
/* self-check: a built-in that doesn't satisfy its own format is a bug, and the
   authoring skill is told to imitate it. Loud in the console, harmless in use. */
BUILTIN_PROGRAMS.forEach(def=>{
  const r = validateProgram(def);
  if(!r.ok) console.error("Built-in program "+def.id+" fails validation:", r.errors);
});
awardBadges();
render();
</script>
</body>
</html>
