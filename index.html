<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Off-Ice — Jump Training</title>
<meta name="theme-color" content="#0B1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- themes ---------- */
:root{
  --bg:#0B1020; --surface:#141B33; --surface2:#1C2544; --line:#2A3455;
  --ink:#EAF0FF; --muted:#8FA0C8; --accent:#FFB454; --accent-ink:#2A1B00; --edge:#5FE3D0;
}
[data-theme="sunrise"]{
  --bg:#FFF6F0; --surface:#FFFFFF; --surface2:#FFEDE4; --line:#F2DCD0;
  --ink:#2B1F2E; --muted:#7A6A78; --accent:#F2668B; --accent-ink:#FFFFFF; --edge:#FF9E5E;
}
[data-theme="cotton"]{
  --bg:#FBF2FF; --surface:#FFFFFF; --surface2:#F3E6FF; --line:#E7D6F7;
  --ink:#33224A; --muted:#7C6A96; --accent:#B15CE8; --accent-ink:#FFFFFF; --edge:#56C9E8;
}
[data-theme="emerald"]{
  --bg:#071614; --surface:#0F2724; --surface2:#16332F; --line:#22453F;
  --ink:#E6FFF8; --muted:#83B3A8; --accent:#F5D36B; --accent-ink:#1E1800; --edge:#3FD9A0;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;line-height:1.1;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--edge);outline-offset:2px;border-radius:6px}
input,textarea{font:inherit;color:inherit}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 8px}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:26px;letter-spacing:-.02em}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px}

/* ---------- rotation meter ---------- */
.meter{display:flex;align-items:center;gap:20px}
.dial{position:relative;flex:0 0 132px;width:132px;height:132px}
.dial svg{transform:rotate(-90deg);display:block}
.dial .track{stroke:var(--line)}
.dial .fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,1,.4,1)}
.dial .cap{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .cap b{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;display:block;line-height:1}
.dial .cap span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.landed .fill{stroke:var(--edge)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;
  padding:13px 20px;border-radius:12px;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:14px;border-radius:10px}

/* ---------- toggle row ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{font-weight:600}
.switch{flex:0 0 54px;height:31px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:99px;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(23px);background:var(--accent-ink)}

/* ---------- exercise wizard ---------- */
.stepbar{display:flex;gap:4px;margin-bottom:16px}
.stepbar span{flex:1;height:4px;border-radius:99px;background:var(--line)}
.stepbar span.done{background:var(--edge)}
.stepbar span.now{background:var(--accent)}

.exname{font-size:24px;letter-spacing:-.02em;margin-bottom:4px}
.why{color:var(--muted);font-size:14px;margin:0 0 16px}
.how{margin:0 0 14px;padding-left:18px}
.how li{margin-bottom:6px}
.tips{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px}
.tips p{margin:0 0 6px;color:var(--muted)}
.tips ul{margin:0;padding-left:16px}
.tips li{margin-bottom:4px}

.target{display:flex;align-items:baseline;gap:8px;margin:18px 0 10px}
.target b{font-family:"JetBrains Mono",monospace;font-size:22px;color:var(--accent)}
.target span{font-size:13px;color:var(--muted)}

.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px}
.set.on{border-color:var(--edge)}
.set .n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:44px;flex:0 0 44px}
.set input{width:64px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;
  font-family:"JetBrains Mono",monospace;font-weight:700}
.set .unit{font-size:13px;color:var(--muted);flex:1}
.set .tick{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-content:center;font-size:17px}
.set.on .tick{background:var(--edge);color:var(--bg);border-color:var(--edge)}

/* ---------- timer ---------- */
.timer{text-align:center;background:var(--surface2);border-radius:14px;padding:18px;margin:14px 0}
.timer .clock{font-family:"JetBrains Mono",monospace;font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1}
.timer .clock.go{color:var(--accent)}
.timer .ctl{display:flex;gap:8px;justify-content:center;margin-top:12px}

.nav2{display:flex;gap:10px;margin-top:18px}
.nav2 .btn{flex:1}

/* ---------- program list ---------- */
.phase-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.phase-h h2{font-size:17px}
.pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.live{background:var(--accent);color:var(--accent-ink)}
.exrow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.exrow b{font-weight:600}
.exrow .t{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--accent);white-space:nowrap}

/* ---------- history ---------- */
.hist{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.hist .d{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);flex:0 0 58px;padding-top:2px}
.hist .b{flex:1;font-size:14px}
.hist .feel{font-size:18px;flex:0 0 auto}
.flagged{color:var(--accent);font-weight:600;font-size:13px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--surface2);border-radius:13px;padding:12px 8px;text-align:center;opacity:.32}
.badge.got{opacity:1;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.badge .ic{font-size:22px}
.badge .nm{font-size:11px;font-weight:600;margin-top:4px;line-height:1.25}

.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check .box{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);display:grid;place-content:center;font-size:14px;margin-top:1px}
.check.on .box{background:var(--edge);border-color:var(--edge);color:var(--bg)}
.check .tx{font-size:14px}

/* ---------- feel picker ---------- */
.feels{display:flex;gap:8px}
.feels button{flex:1;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:12px 6px;text-align:center}
.feels button.on{border-color:var(--accent)}
.feels .e{font-size:22px;display:block}
.feels .l{font-size:12px;color:var(--muted);margin-top:3px}
textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:84px;resize:vertical;margin-top:10px}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:48px;font-weight:500}

.greet{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:600;font-size:17px;line-height:1.35;
  letter-spacing:-.01em;margin:0 0 16px;padding-left:14px;border-left:3px solid var(--accent)}

.notice{background:var(--surface2);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:12px}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button .ic{font-size:19px}
nav button[aria-current="true"]{color:var(--accent)}

.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (min-width:720px){
  .wrap{padding-top:32px}
  .top h1{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Off-ice</div>
      <h1 id="title">Today</h1>
    </div>
    <div class="eyebrow mono" id="phaseTag"></div>
  </div>
  <main id="view"></main>
</div>

<nav>
  <button data-go="today" aria-current="true"><span class="ic">⛸</span>Today</button>
  <button data-go="program"><span class="ic">☰</span>Program</button>
  <button data-go="progress"><span class="ic">◍</span>Progress</button>
  <button data-go="settings"><span class="ic">⚙</span>Settings</button>
</nav>

<script>
"use strict";

/* ============ CORE EXERCISE LIBRARY ============ */
/* Versioned. A program pins the version it was authored against, so shipping a
   new library version can never change an already-installed program.
   Never edit a published version in place — add CORE_LIB[2] and leave [1] alone. */
const CORE_LIB = {};
const CORE_LIB_LATEST = 1;

CORE_LIB[1] = {
  warmup:{name:"Warm-up",mode:"hold",sets:1,base:180,step:0,max:180,perSide:false,
    why:"Gets blood into the legs so nothing is cold when the real work starts.",
    how:["March in place, lifting knees, for about a minute.","Arm circles: 10 forward, 10 back.","6 slow walking lunges on each leg.","Roll each ankle 10 times in both directions."],
    tips:["Easy pace. This is not the workout.","If you just came off the ice you can shorten this."]},

  tib:{name:"Tibialis raises",mode:"reps",sets:3,base:15,step:2,max:30,perSide:true,
    why:"Builds the muscle down the front of your shin. It controls your ankle when you set the toe pick and when you land.",
    how:["Sit on a chair with both feet flat on the floor.","Keeping your heel down, pull your toes up toward your shin as far as they go.","Hold the top for 2 seconds.","Lower slowly, over about 3 seconds."],
    tips:["Slow on the way down is where the strength comes from.","Burning in the shin is the point. Sharp pain is not.","To make it harder, rest a shoe or small bottle across your toes."]},

  calfStraight:{name:"Calf raises, straight leg",mode:"reps",sets:3,base:10,step:2,max:25,perSide:true,
    why:"The upper calf is what pushes you off the ice. Single leg, because that is how you jump.",
    how:["Stand near a wall or barre, fingertips touching for balance only.","Lift one foot slightly off the floor.","Rise onto the toes of the standing foot over 2 seconds.","Hold the top for 1 second, lower over 2 seconds."],
    tips:["Fingertips are for balance, not for lifting you.","Keep the ankle straight. No rolling in or out.","Full height every rep. Half reps do half the work."]},

  calfBent:{name:"Calf raises, bent knee",mode:"reps",sets:3,base:12,step:2,max:25,perSide:true,
    why:"Reaches the deeper calf muscle underneath. This is the one that absorbs landings.",
    how:["Sit with your knee bent at about 90 degrees, foot flat.","Press through the ball of your foot to lift your heel.","Hold at the top, then lower under control."],
    tips:["It should feel different and deeper than the straight-leg version.","Add weight by resting something on your thigh, close to the knee."]},

  bridge:{name:"Single-leg glute bridge",mode:"reps",sets:3,base:10,step:2,max:20,perSide:true,
    why:"Wakes up the glutes. Jump height comes from the hips as much as the ankles.",
    how:["Lie on your back, knees bent, feet flat.","Lift one foot a few inches off the floor.","Push through the heel of the grounded foot and lift your hips.","Squeeze at the top, lower slowly."],
    tips:["Keep your hips level. Don't let one side drop.","Squeeze the glute, don't arch your lower back."]},

  wallsit:{name:"Wall sit",mode:"hold",sets:3,base:25,step:5,max:60,perSide:false,
    why:"Builds the quad strength that absorbs a landing instead of collapsing into it.",
    how:["Stand with your back flat against a wall, feet about two steps out.","Slide down until your knees are bent near 90 degrees.","Hold. Keep your whole back on the wall."],
    tips:["Knees point over your toes, not caved inward.","Keep breathing. Don't hold your breath.","If your knees complain, slide less deep."]},

  split:{name:"ATG split squat",mode:"reps",sets:3,base:8,step:1,max:15,perSide:true,
    why:"Loads one leg deeply through a full range. This is the shape your leg makes right before a jump.",
    how:["Stand in a split stance, one foot well forward.","Bend the front knee and lower until the back knee is near the floor.","Let the front knee travel forward over the toes.","Push through the front foot to stand."],
    tips:["Go only as deep as you can control today. Depth builds over weeks.","Back heel comes up, that's fine.","Chest stays tall."]},

  backwalk:{name:"Backward walks",mode:"reps",sets:3,base:12,step:2,max:24,perSide:false,
    why:"Loads the front of the shin and knee the way nothing else does. This is the backbone of the whole method.",
    how:["Find a clear stretch of floor or hallway.","Walk backward with deliberate, controlled steps.","Land on the ball of the foot and roll back.","Count steps, not distance."],
    tips:["Lean slightly forward from the ankles, not the waist.","Slow beats fast here.","Uphill outside, or dragging something light, makes it harder."]},

  minijump:{name:"Mini jumps",mode:"reps",sets:3,base:6,step:1,max:12,jump:true,perSide:false,
    why:"Trains explosive push-off and, more importantly, a quiet controlled landing.",
    how:["Stand with feet hip-width, small bend in the knees.","Jump straight up.","Land softly, absorb into a bend, and stop.","Pause a full second before the next one."],
    tips:["This is not bouncing. Every rep starts from a stop.","Listen. Quiet landing means good landing.","If landings get loud or sloppy, the set is over."]},

  balance:{name:"Single-leg balance with arms",mode:"hold",sets:3,base:25,step:5,max:50,perSide:true,balanceScore:true,
    why:"Trains the ankle to hold steady while your upper body moves. That is rotation control.",
    how:["Stand on one leg, other knee lifted toward hip height.","Hold the position while your arms move through your jump pull-in.","Keep the standing ankle quiet."],
    tips:["The standing foot should not be sliding around.","Eyes on a fixed point helps.","Harder version: do it on a pillow or folded towel."]},

  hops:{name:"Forward hops",mode:"reps",sets:3,base:8,step:1,max:14,jump:true,perSide:true,
    why:"Single-leg spring, forward. Closest off-ice match to an axel takeoff.",
    how:["Stand on one leg.","Hop forward a short distance.","Land on the same leg and hold the landing for a second.","Reset and repeat."],
    tips:["Distance is not the goal. Sticking the landing is.","If you can't hold the landing, hop shorter."]},

  rotate:{name:"Standing rotations",mode:"reps",sets:3,base:10,step:2,max:20,perSide:true,
    why:"Core control through rotation, on one leg, like every jump you do.",
    how:["Stand on one leg, arms crossed over your chest.","Rotate your upper body toward one side, slow and controlled.","Return to center. Keep the hips facing forward."],
    tips:["Hips stay square. Only the upper body turns.","Slow. This is control work, not speed work."]},

  lateral:{name:"Lateral lunges",mode:"reps",sets:3,base:8,step:1,max:15,perSide:true,
    why:"Builds sideways strength for the landings that don't come down perfectly on-axis.",
    how:["Step wide to one side.","Bend that knee and sit back into the hip, keeping the other leg straight.","Push back to standing."],
    tips:["Toes point forward on both feet.","Chest up, weight into the heel of the bent leg."]},

  stepdown:{name:"Controlled step-downs",mode:"reps",sets:3,base:8,step:1,max:15,perSide:true,
    why:"Teaches the leg to lower your whole bodyweight slowly. That is exactly what a landing is.",
    how:["Stand on a low step, about 4 to 6 inches.","Standing on one leg, lower the other foot slowly toward the floor.","Tap the floor lightly, then press back up."],
    tips:["Take 3 seconds on the way down.","A loud tap means you dropped. Go slower or use a lower step.","Keep the standing knee tracking over the toes."]},

  cooldown:{name:"Cool-down",mode:"hold",sets:1,base:120,step:0,max:120,perSide:false,
    why:"Lets everything settle so tomorrow's skating doesn't start stiff.",
    how:["Quad stretch, 20 seconds each leg.","Calf stretch against a wall, 20 seconds each leg.","Hip flexor stretch in a half-kneel, 20 seconds each side.","Walk easy for a minute."],
    tips:["Stretch to gentle tension, never to pain."]}
};

/* ============ BUILT-IN PROGRAM ============ */
/* Conforms to program.schema.json. This is the same program the app has always
   shipped, expressed in the portable format so it round-trips through
   export/import like any authored program. */
const BUILTIN_ATG = {
  schemaVersion:1,
  id:"atg-jump",
  name:"Off-Ice Jump Training",
  version:"1.0.0",
  coreLibrary:1,
  author:"Built in",
  summary:"Three-phase off-ice progression for a jumping skater. Ankle and tibialis work as the foundation, then power, then jump-specific spring and landing mechanics.",
  basedOn:["Ben Patrick / Knees Over Toes — gradual loading, full range of motion, knees tracking over toes"],
  disclaimer:"This is general training guidance, not medical or coaching advice. Volume and jump work should be cleared with a skating coach or a trainer who works with young athletes — especially during a growth spurt.",
  weeklyGoal:3,
  progression:{strategy:"linear-step",params:{shortfall:0.7}},
  unlock:{strategy:"sessions-in-phase",params:{n:9}},
  phases:[
    {id:"foundation",name:"Foundation",weeks:"Weeks 1–3",unlockAfter:9,
     blurb:"Ankles, calves, glutes, quads. Nothing explosive yet. This is the base everything else sits on.",
     plan:["core:warmup","core:tib","core:calfStraight","core:calfBent","core:bridge","core:wallsit","core:cooldown"]},
    {id:"power",name:"Power",weeks:"Weeks 4–6",unlockAfter:9,
     blurb:"The foundation work stays, and explosive movement gets added on top of it.",
     plan:["core:warmup","core:tib","core:calfStraight","core:split","core:backwalk","core:minijump","core:balance","core:cooldown"]},
    {id:"jump",name:"Jump-specific",weeks:"Weeks 7+",
     blurb:"Single-leg spring, rotation control, and landing mechanics for each jump type.",
     plan:["core:warmup","core:calfStraight","core:split","core:hops","core:rotate","core:lateral","core:stepdown","core:balance","core:cooldown"]}
  ],
  checklist:[
    {id:"c1",t:"20 single-leg calf raises on each leg, full height"},
    {id:"c2",t:"45-second wall sit without sliding down"},
    {id:"c3",t:"10 split squats each leg with the knee tracking over the toes"},
    {id:"c4",t:"10 mini jumps in a row with quiet landings"},
    {id:"c5",t:"40-second single-leg balance, ankle steady"},
    {id:"c6",t:"8 step-downs each leg, 3 seconds down, no drop"},
    {id:"c7",t:"No ankle or knee pain during any of it"}
  ],
  badges:[]
};

const BUILTIN_PROGRAMS = [BUILTIN_ATG];

/* App career badges. These count across every program she ever runs — switching
   programs must never cost her one. Program-defined badges are separate, are
   namespaced programId:badgeId, and score only their own program's sessions. */
const BADGES = [
  {id:"first",ic:"⛸",nm:"First session",test:()=>S.sessions.length>=1},
  {id:"s10",ic:"◈",nm:"10 sessions",test:()=>S.sessions.length>=10},
  {id:"s25",ic:"◆",nm:"25 sessions",test:()=>S.sessions.length>=25},
  {id:"s50",ic:"✦",nm:"50 sessions",test:()=>S.sessions.length>=50},
  {id:"w1",ic:"↻",nm:"Week landed",test:()=>weeksLanded()>=1},
  {id:"w4",ic:"↻↻",nm:"4 weeks landed",test:()=>weeksLanded()>=4},
  {id:"w12",ic:"❄",nm:"12 weeks landed",test:()=>weeksLanded()>=12},
  {id:"p2",ic:"②",nm:"Phase 2",test:()=>curPhase()>=2},
  {id:"p3",ic:"③",nm:"Phase 3",test:()=>curPhase()>=3},
  {id:"ready",ic:"★",nm:"Jump ready",test:()=>CHECKLIST.length>0 && CHECKLIST.every(c=>checklistState()[c.id])},
  {id:"m1",ic:"↑",nm:"First measurement",test:()=>S.jumps.length>=1},
  {id:"m5",ic:"↑↑",nm:"5 jump tests",test:()=>S.jumps.length>=5},
  {id:"mup",ic:"⇧",nm:"Jumped higher",test:()=>S.jumps.length>=2 && Math.max(...S.jumps.map(j=>j.cm)) > S.jumps[0].cm}
];

const THEMES=[["midnight","Midnight Rink"],["sunrise","Sunrise Session"],["cotton","Cotton Candy"],["emerald","Emerald Edge"]];

/* ============ GREETINGS ============ */
/* {n} is replaced with the skater's name, or dropped cleanly if there isn't one. */
const GREET = {
  general:[
    "Morning, {n}. The ice isn't going anywhere, but neither are you.",
    "{n} — quiet landings today.",
    "Back again, {n}. That's the whole trick.",
    "Hey {n}. Strong ankles, strong axel.",
    "{n}, today's job is form. Height comes later.",
    "Good to see you, {n}. Let's build something.",
    "{n} — slow reps beat fast reps. Every time.",

function hashDay(seed){
  let h=2166136261;
  const s=String(seed);
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return Math.abs(h);
}
function greetingBank(){
  const last = S.sessions[S.sessions.length-1];
  if(last && last.hurt && (Date.now()-last.date) < 5*86400000) return "sore";
  if(sessionsThisWeek() >= weeklyGoal()) return "landed";
  if(last && (Date.now()-last.date) > 5*86400000) return "back";
  return "general";
}
function greetingToday(){
  const bank = GREET[greetingBank()];
  const d = new Date();
  const daySeed = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
  const line = bank[hashDay(daySeed) % bank.length];
  const nm = (S.profile && S.profile.name || "").trim();
  if(nm) return line.replace(/\{n\}/g, esc(nm));
  // no name: drop the placeholder and tidy the leftover punctuation
  return line
    .replace(/^\{n\}\s*[—–-]\s*/,"")
    .replace(/^\{n\}\s*,\s*/,"")
    .replace(/[,]?\s*\{n\}(?=[.,!?])/g,"")
    .replace(/\s*\{n\}\s*/g," ")
    .replace(/\s{2,}/g," ")
    .replace(/^([a-z])/, m=>m.toUpperCase())
    .trim();
}

/* ============ PROGRAM FORMAT ============ */
/* A program is untrusted input — it may have been generated by an agent from a
   loose natural-language brief. Everything below treats it that way: strings are
   stripped of markup, volume is capped, and rules are looked up in a closed
   registry rather than evaluated. See PROGRAM_FORMAT.md and program.schema.json. */

const LIMITS = {
  sets:6, planLen:12, days:7, phases:12,
  reps:100, hold:600, repStep:20, holdStep:60,
  jumpReps:20, jumpSets:4
};

/* Named strategies. A program picks one by name and passes parameters. It can
   never supply an expression or anything else the app would have to evaluate. */
const PROGRESSION = {
  "none": ()=>null,
  /* Every set at target and the session felt fine → up a step. Tough, or a set
     well short of target → down a step. Clamped to base/max. */
  "linear-step": (ctx)=>{
    const {ex,cur,done,needed,feel,hurt,params} = ctx;
    const shortfall = params.shortfall!=null ? params.shortfall : 0.7;
    const allFull = done.length >= needed && done.every(v=>v>=cur);
    if(allFull && feel!=="tough" && !hurt) return Math.min(ex.max, cur + ex.step);
    if(feel==="tough" || done.some(v=>v < cur*shortfall)) return Math.max(ex.base, cur - ex.step);
    return cur;
  },
  /* Conservative: needs N consecutive clean sessions before a target moves up.
     Never steps down on a single rough day. Good coming back from pain. */
  "hold-until-clean": (ctx)=>{
    const {ex,cur,done,needed,feel,hurt,params,streak} = ctx;
    const want = params.cleanSessions!=null ? params.cleanSessions : 2;
    const clean = done.length >= needed && done.every(v=>v>=cur) && feel!=="tough" && !hurt;
    if(clean && streak+1 >= want) return Math.min(ex.max, cur + ex.step);
    return cur;
  },
  /* Reps climb to the top of the range, then reset to the bottom. The step up in
     difficulty is the skater's to make (more load, harder variation). */
  "double-progression": (ctx)=>{
    const {ex,cur,done,needed,feel,hurt,params} = ctx;
    const range = params.repRange || [ex.base, ex.max];
    const allFull = done.length >= needed && done.every(v=>v>=cur);
    if(!allFull || feel==="tough" || hurt) return cur;
    return cur + ex.step > range[1] ? range[0] : Math.min(ex.max, cur + ex.step);
  }
};

const UNLOCK = {
  "manual": ()=>true,
  "sessions-in-phase": (ctx)=>ctx.sessionsInPhase >= (ctx.n!=null?ctx.n:9),
  "weeks-in-phase": (ctx)=>ctx.weeksInPhase >= (ctx.n!=null?ctx.n:3)
};

const BADGE_RULES = {
  sessionCount:      (c,p)=>c.sessions.length >= (p.n||1),
  weeksLanded:       (c,p)=>c.weeksLanded >= (p.n||1),
  phaseReached:      (c,p)=>c.phaseIds.indexOf(p.phase) >= 0 && c.phaseIndex >= c.phaseIds.indexOf(p.phase)+1,
  checklistComplete: (c)=>c.checklist.length>0 && c.checklist.every(x=>c.checked[x.id]),
  exerciseTarget:    (c,p)=>(c.targets[p.ex]||0) >= (p.value||1),
  exerciseSessions:  (c,p)=>c.sessions.filter(s=>s.exercises.some(r=>r.id===p.ex && r.sets.some(v=>v!=null))).length >= (p.n||1),
  jumpCount:         (c,p)=>c.jumps.length >= (p.n||1),
  jumpImprovement:   (c,p)=>c.jumps.length>=2 && Math.max(...c.jumps.map(j=>j.cm)) - c.jumps[0].cm >= (p.cm||1),
  painFreeSessions:  (c,p)=>c.sessions.slice(-(p.n||1)).filter(s=>!s.hurt).length >= (p.n||1)
};

/* Strip markup and control characters. Program copy is rendered through esc()
   too; this is the boundary check so nothing markup-shaped is ever stored. */
function sanitizeText(v, maxLen){
  if(typeof v !== "string") return "";
  return v.replace(/<[^>]*>/g,"")
          .replace(/[\x00-\x1f\x7f]/g," ")
          .replace(/\s{2,}/g," ")
          .trim()
          .slice(0, maxLen||600);
}
function sanitizeList(a, maxItems, maxLen){
  if(!Array.isArray(a)) return [];
  return a.slice(0,maxItems).map(x=>sanitizeText(x,maxLen)).filter(Boolean);
}

/* Turn a phase's `plan` shorthand into the canonical single-entry `days` form,
   so everything downstream only ever deals with days. */
function phaseDays(ph){
  if(Array.isArray(ph.days) && ph.days.length) return ph.days;
  return [{id:"main", name:"Main", plan:Array.isArray(ph.plan)?ph.plan:[]}];
}

function validateProgram(def){
  const errors = [], warnings = [];
  const E = m=>errors.push(m), W = m=>warnings.push(m);

  if(!def || typeof def !== "object"){ return {ok:false, errors:["Not a JSON object."], warnings:[]}; }
  if(def.schemaVersion !== 1) E(`schemaVersion must be 1 (got ${JSON.stringify(def.schemaVersion)}).`);
  if(!/^[a-z0-9][a-z0-9-]{1,48}$/.test(def.id||"")) E("id must be lowercase letters, digits and hyphens.");
  if(!def.name) E("name is required.");
  if(!/^\d+\.\d+\.\d+$/.test(def.version||"")) E("version must look like 1.0.0.");
  if(sanitizeText(def.disclaimer,800).length < 40)
    E("disclaimer is required and must actually say that this is general training guidance, not medical or coaching advice.");

  const libV = def.coreLibrary;
  if(!CORE_LIB[libV]) E(`This program was written against core library v${libV}, which this version of the app doesn't have. Update the app, or ask for the program to be rebuilt against v${CORE_LIB_LATEST}.`);
  const lib = CORE_LIB[libV] || CORE_LIB[CORE_LIB_LATEST];

  if(def.weeklyGoal!=null && !(def.weeklyGoal>=1 && def.weeklyGoal<=7)) E("weeklyGoal must be 1–7.");

  const local = def.exercises && typeof def.exercises==="object" ? def.exercises : {};
  const known = id => id.slice(0,5)==="core:" ? !!lib[id.slice(5)] : !!local[id];

  Object.keys(def.overrides||{}).forEach(k=>{
    if(k.slice(0,5)!=="core:") E(`overrides key "${k}" must be a core: reference. Program-defined exercises are edited directly.`);
    else if(!lib[k.slice(5)]) E(`overrides references "${k}", which isn't in core library v${libV}.`);
    const o = def.overrides[k]||{};
    if(o.name!=null || o.mode!=null) E(`overrides for "${k}" cannot change name or mode.`);
  });

  const checkEx = (id, e)=>{
    if(!e.name) E(`Exercise "${id}" needs a name.`);
    if(e.mode!=="reps" && e.mode!=="hold") E(`Exercise "${id}" mode must be "reps" or "hold".`);
    const isJump = !!e.jump, isHold = e.mode==="hold";
    const setCap = isJump ? LIMITS.jumpSets : LIMITS.sets;
    const valCap = isJump ? LIMITS.jumpReps : (isHold ? LIMITS.hold : LIMITS.reps);
    if(!(e.sets>=1 && e.sets<=setCap)) E(`Exercise "${id}" sets must be 1–${setCap}${isJump?" (plyometrics are capped harder)":""}.`);
    if(!(e.base>=1 && e.base<=valCap)) E(`Exercise "${id}" base must be 1–${valCap}${isHold?" seconds":" reps"}.`);
    if(e.max!=null && !(e.max>=1 && e.max<=valCap)) E(`Exercise "${id}" max must be 1–${valCap}.`);
    if(e.max!=null && e.base!=null && e.max < e.base) E(`Exercise "${id}" has max below base.`);
    const stepCap = isHold ? LIMITS.holdStep : LIMITS.repStep;
    if(e.step!=null && !(e.step>=0 && e.step<=stepCap)) E(`Exercise "${id}" step must be 0–${stepCap}.`);
    if(e.balanceScore && !isHold) W(`Exercise "${id}" sets balanceScore but isn't a hold — it will be ignored.`);
    (e.alternatives||[]).forEach(alt=>{
      if(!known(alt)) E(`Exercise "${id}" lists alternative "${alt}", which doesn't resolve.`);
    });
    const needsKit = (e.equipment||[]).some(q=>q && !q.optional);
    if(needsKit && !(e.alternatives||[]).length)
      W(`Exercise "${id}" requires equipment but offers no alternatives — if she doesn't have it, that's a hole in the session.`);
  };
  Object.keys(local).forEach(id=>{
    if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,48}$/.test(id)) E(`Exercise id "${id}" has characters that aren't allowed.`);
    if(id.slice(0,5)==="core:") E(`Exercise id "${id}" must not use the core: prefix.`);
    checkEx(id, local[id]||{});
  });

  const phases = Array.isArray(def.phases) ? def.phases : [];
  if(!phases.length) E("A program needs at least one phase.");
  if(phases.length > LIMITS.phases) E(`Too many phases (max ${LIMITS.phases}).`);
  const seenPhase = {};
  phases.forEach((ph,i)=>{
    const where = `Phase ${i+1}${ph && ph.name?` ("${ph.name}")`:""}`;
    if(!ph || typeof ph!=="object") { E(`${where} is not an object.`); return; }
    if(!ph.id) E(`${where} needs an id.`);
    if(seenPhase[ph.id]) E(`Duplicate phase id "${ph.id}".`);
    seenPhase[ph.id] = 1;
    if(!ph.name) E(`${where} needs a name.`);
    if(ph.plan && ph.days) E(`${where} has both plan and days. Use one.`);
    const days = phaseDays(ph);
    if(days.length > LIMITS.days) E(`${where} has ${days.length} day variants (max ${LIMITS.days}).`);
    days.forEach(d=>{
      const dw = `${where} day "${(d&&d.name)||"?"}"`;
      if(!d || !Array.isArray(d.plan) || !d.plan.length){ E(`${dw} has an empty plan.`); return; }
      if(d.plan.length > LIMITS.planLen) E(`${dw} has ${d.plan.length} exercises (max ${LIMITS.planLen}). That's a long session for a young athlete.`);
      d.plan.forEach(ref=>{ if(!known(ref)) E(`${dw} references "${ref}", which doesn't resolve to a core library or program exercise.`); });
    });
    if(ph.rotate && ph.rotate!=="sequential" && ph.rotate!=="choose") E(`${where} rotate must be "sequential" or "choose".`);
    if(ph.unlockAfter!=null && !(ph.unlockAfter>=0 && ph.unlockAfter<=200)) E(`${where} unlockAfter must be 0–200.`);
  });

  const strat = (obj, registry, label)=>{
    if(!obj) return;
    if(!registry[obj.strategy]) E(`Unknown ${label} strategy "${obj.strategy}". Available: ${Object.keys(registry).join(", ")}.`);
  };
  strat(def.progression, PROGRESSION, "progression");
  strat(def.unlock, UNLOCK, "unlock");
  if(def.volumeScaling && ["none","age-banded","bodyweight-scaled"].indexOf(def.volumeScaling.strategy)<0)
    E(`Unknown volumeScaling strategy "${def.volumeScaling.strategy}".`);

  (def.badges||[]).forEach(b=>{
    if(!b || !b.id || !b.nm){ E("Every badge needs an id and a name."); return; }
    if(!b.rule || !BADGE_RULES[b.rule.type]) E(`Badge "${b.id}" uses unknown rule type "${b.rule&&b.rule.type}". Available: ${Object.keys(BADGE_RULES).join(", ")}.`);
    const p = (b.rule&&b.rule.params)||{};
    if(p.ex && !known(p.ex)) E(`Badge "${b.id}" references exercise "${p.ex}", which doesn't resolve.`);
  });

  return {ok:errors.length===0, errors, warnings};
}

/* Resolve a definition into the runtime view the app renders from: core refs
   merged with overrides, phases normalised to days, copy sanitised. */
function resolveProgram(def){
  const lib = CORE_LIB[def.coreLibrary] || CORE_LIB[CORE_LIB_LATEST];
  const local = def.exercises || {};
  const overrides = def.overrides || {};

  const cleanEx = (id, raw)=>{
    const e = Object.assign({}, raw);
    e.id = id;
    e.name = sanitizeText(e.name, 60);
    e.mode = e.mode==="hold" ? "hold" : "reps";
    e.sets = Math.max(1, Math.min(e.jump?LIMITS.jumpSets:LIMITS.sets, e.sets|0));
    const cap = e.jump ? LIMITS.jumpReps : (e.mode==="hold" ? LIMITS.hold : LIMITS.reps);
    e.base = Math.max(1, Math.min(cap, e.base|0));
    e.max  = Math.max(e.base, Math.min(cap, (e.max!=null?e.max:e.base)|0));
    e.step = Math.max(0, Math.min(e.mode==="hold"?LIMITS.holdStep:LIMITS.repStep, e.step|0));
    e.perSide = !!e.perSide; e.jump = !!e.jump;
    e.balanceScore = !!e.balanceScore && e.mode==="hold";
    e.why  = sanitizeText(e.why, 400);
    e.how  = sanitizeList(e.how, 10, 240);
    e.tips = sanitizeList(e.tips, 10, 240);
    e.equipment = (Array.isArray(e.equipment)?e.equipment:[]).slice(0,4).map(q=>({
      id: sanitizeText(q&&q.id, 48),
      label: sanitizeText(q&&q.label, 60),
      optional: !!(q&&q.optional),
      params: (q&&q.params && typeof q.params==="object") ? q.params : {}
    })).filter(q=>q.label);
    e.alternatives = (Array.isArray(e.alternatives)?e.alternatives:[]).slice(0,4);
    return e;
  };

  const exercises = {};
  const want = {};
  (def.phases||[]).forEach(ph=>phaseDays(ph).forEach(d=>(d.plan||[]).forEach(ref=>{ want[ref]=1; })));
  Object.keys(overrides).forEach(k=>{ want[k]=1; });
  /* pull in alternatives too, they can be selected mid-session */
  let pass = 0;
  while(pass++ < 3){
    Object.keys(want).forEach(ref=>{
      if(exercises[ref]) return;
      const isCore = ref.slice(0,5)==="core:";
      const src = isCore ? lib[ref.slice(5)] : local[ref];
      if(!src) return;
      const merged = isCore ? Object.assign({}, src, overrides[ref]||{}) : src;
      exercises[ref] = cleanEx(ref, merged);
    });
    let added = false;
    Object.keys(exercises).forEach(ref=>{
      exercises[ref].alternatives.forEach(a=>{ if(!want[a]){ want[a]=1; added=true; } });
    });
    if(!added) break;
  }

  const phases = (def.phases||[]).map((ph,i)=>({
    n: i+1,
    id: ph.id,
    name: sanitizeText(ph.name, 40),
    weeks: sanitizeText(ph.weeks, 30),
    blurb: sanitizeText(ph.blurb, 400),
    unlockAfter: ph.unlockAfter,
    rotate: ph.rotate==="choose" ? "choose" : "sequential",
    days: phaseDays(ph).map((d,j)=>({
      id: d.id || ("d"+j),
      name: sanitizeText(d.name, 40) || "Main",
      blurb: sanitizeText(d.blurb, 300),
      plan: (d.plan||[]).filter(ref=>exercises[ref])
    })),
    /* first day's plan — what single-day phases and the Program view read */
    get plan(){ return this.days[0].plan; }
  }));

  return {
    def,
    id: def.id,
    name: sanitizeText(def.name, 60),
    version: def.version,
    summary: sanitizeText(def.summary, 400),
    author: sanitizeText(def.author, 80),
    disclaimer: sanitizeText(def.disclaimer, 800),
    basedOn: sanitizeList(def.basedOn, 12, 200),
    weeklyGoal: (def.weeklyGoal>=1 && def.weeklyGoal<=7) ? def.weeklyGoal : 3,
    metrics: Array.isArray(def.metrics) ? def.metrics.slice(0,8) : [],
    progression: def.progression && PROGRESSION[def.progression.strategy]
      ? def.progression : {strategy:"linear-step", params:{shortfall:0.7}},
    unlock: def.unlock && UNLOCK[def.unlock.strategy]
      ? def.unlock : {strategy:"sessions-in-phase", params:{n:9}},
    volumeScaling: def.volumeScaling || {strategy:"none", params:{}},
    exercises,
    phases,
    checklist: (Array.isArray(def.checklist)?def.checklist:[]).slice(0,15)
      .map(c=>({id:c.id, t:sanitizeText(c.t,160)})).filter(c=>c.id && c.t),
    badges: (Array.isArray(def.badges)?def.badges:[]).slice(0,20)
      .filter(b=>b && b.id && b.nm && b.rule && BADGE_RULES[b.rule.type])
      .map(b=>({id:b.id, ic:sanitizeText(b.ic,4)||"◆", nm:sanitizeText(b.nm,40), rule:b.rule}))
  };
}

/* ============ STATE ============ */
const KEY="office-jump-v1";
const STATE_VERSION = 2;

let P = null;                 /* resolved active program */
let EX = {}, PHASES = [], CHECKLIST = [];   /* live views onto P, rebuilt on switch */

let S = load();
let view = "today";
let step = 0;
let timer = {id:null,left:0,total:0,running:false};

function blank(){
  return {
    v:STATE_VERSION, theme:"midnight", setupDone:false,
    profile:{name:"", dob:null},
    equipment:"",                 /* free text: what she has to train with */
    activeProgram:BUILTIN_ATG.id,
    programs:{},                  /* id -> {def, phase, dayIndex, targets, checklist, archived, installedAt} */
    weeklyGoalOverride:null,
    sessions:[], badges:[], jumps:[],
    metrics:{},                   /* metricId -> [{date, value}] */
    active:null,
    measure:{on:false,seen:false}
  };
}

function programRecord(def){
  return {def, phase:1, dayIndex:0, targets:{}, checklist:{}, archived:{}, installedAt:Date.now()};
}

/* Old saves keyed exercises by bare id; the portable format namespaces the
   built-in ones. Remap so a returning skater keeps every adapted target. */
function remapCoreId(id){
  return CORE_LIB[1][id] ? "core:"+id : id;
}

function migrate(raw){
  if(!raw || typeof raw!=="object") return null;
  if((raw.v|0) >= 2) return raw;

  const s = blank();
  s.theme = raw.theme || s.theme;
  s.setupDone = !!raw.setupDone;
  s.profile = {name:(raw.profile&&raw.profile.name)||"", dob:null};
  s.badges = Array.isArray(raw.badges) ? raw.badges.slice() : [];
  s.jumps = Array.isArray(raw.jumps) ? raw.jumps.slice() : [];
  s.measure = raw.measure || s.measure;

  const fixEx = list => (Array.isArray(list)?list:[]).map(r=>Object.assign({}, r, {id:remapCoreId(r.id)}));
  s.sessions = (Array.isArray(raw.sessions)?raw.sessions:[]).map(x=>
    Object.assign({}, x, {programId:BUILTIN_ATG.id, exercises:fixEx(x.exercises)}));
  s.active = raw.active
    ? Object.assign({}, raw.active, {programId:BUILTIN_ATG.id, exercises:fixEx(raw.active.exercises)})
    : null;

  const targets = {};
  Object.keys(raw.targets||{}).forEach(k=>{ targets[remapCoreId(k)] = raw.targets[k]; });

  const rec = programRecord(BUILTIN_ATG);
  rec.phase = Math.max(1, Math.min(BUILTIN_ATG.phases.length, raw.phase|0 || 1));
  rec.targets = targets;
  rec.checklist = raw.checklist || {};
  s.programs[BUILTIN_ATG.id] = rec;

  if(raw.weeklyGoal && raw.weeklyGoal !== BUILTIN_ATG.weeklyGoal) s.weeklyGoalOverride = raw.weeklyGoal;
  return s;
}

/* Make sure built-ins are installed and the active pointer is valid. Runs on
   every load so a new built-in program appears for existing users too. */
function ensurePrograms(s){
  if(!s.programs || typeof s.programs!=="object") s.programs = {};
  BUILTIN_PROGRAMS.forEach(def=>{
    const have = s.programs[def.id];
    if(!have) s.programs[def.id] = programRecord(def);
    else if(!have.def) have.def = def;
  });
  if(!s.programs[s.activeProgram]){
    s.activeProgram = Object.keys(s.programs)[0] || BUILTIN_ATG.id;
    if(!s.programs[s.activeProgram]) s.programs[s.activeProgram] = programRecord(BUILTIN_ATG);
  }
  const rec = s.programs[s.activeProgram];
  if(rec.phase==null) rec.phase = 1;
  if(rec.dayIndex==null) rec.dayIndex = 0;
  if(!rec.targets) rec.targets = {};
  if(!rec.checklist) rec.checklist = {};
  return s;
}

function hydrate(data){
  const merged = Object.assign(blank(), migrate(data) || {});
  if(!merged.profile) merged.profile = {name:"", dob:null};
  if(!merged.metrics) merged.metrics = {};
  return ensurePrograms(merged);
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ return ensurePrograms(blank()); }   /* storage blocked entirely */
  if(!raw) return ensurePrograms(blank());
  try{
    return hydrate(JSON.parse(raw));
  }catch(e){
    /* Never silently discard a save. Keep the original bytes so a bad migration
       is recoverable, and say so loudly rather than showing an empty app. */
    console.error("Could not read the saved data — starting fresh for this visit. The original is kept under "+KEY+".bak", e);
    try{ localStorage.setItem(KEY+".bak", raw); }catch(e2){}
    return ensurePrograms(blank());
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* storage unavailable — app still works for this visit */ }
}

/* ============ ACTIVE PROGRAM ACCESSORS ============ */
function PS(){ return S.programs[S.activeProgram]; }
function refreshProgram(){
  P = resolveProgram(PS().def);
  EX = P.exercises; PHASES = P.phases; CHECKLIST = P.checklist;
  const rec = PS();
  rec.phase = Math.max(1, Math.min(PHASES.length, rec.phase||1));
  rec.dayIndex = Math.max(0, Math.min(currentPhase().days.length-1, rec.dayIndex||0));
}
function currentPhase(){ return PHASES[Math.max(0, Math.min(PHASES.length-1, (PS().phase||1)-1))]; }
function curPhase(){ return PS().phase || 1; }
function setPhase(n){ PS().phase = Math.max(1, Math.min(PHASES.length, n)); PS().dayIndex = 0; }
function targetsMap(){ return PS().targets; }
function checklistState(){ return PS().checklist; }
function weeklyGoal(){ return S.weeklyGoalOverride || P.weeklyGoal || 3; }

/* ============ HELPERS ============ */
function targetFor(id){
  const e = EX[id];
  if(!e) return 0;
  const t = targetsMap()[id];
  return t != null ? t : e.base;
}
function setsFor(id, heavy){
  const e = EX[id];
  if(!e) return 1;
  let n = e.sets;
  if(n <= 1) return n;              /* warm-ups and cool-downs stay single */
  if(heavy) n = Math.max(2, n-1);
  return n;
}
function planFor(phase, heavy, dayIdx){
  const ph = PHASES[phase-1];
  if(!ph) return [];
  const d = ph.days[Math.max(0, Math.min(ph.days.length-1, dayIdx!=null?dayIdx:(PS().dayIndex||0)))];
  const p = d ? d.plan : [];
  return heavy ? p.filter(id=>EX[id] && !EX[id].jump) : p.slice();
}
function phaseUnlocked(n){
  const ph = PHASES[n-1];
  if(!ph) return false;
  const u = P.unlock;
  const fn = UNLOCK[u.strategy] || UNLOCK["sessions-in-phase"];
  const want = ph.unlockAfter!=null ? ph.unlockAfter : ((u.params&&u.params.n)!=null ? u.params.n : 9);
  const inPhase = S.sessions.filter(s=>s.programId===S.activeProgram && s.phase===n);
  const weeks = Object.keys(inPhase.reduce((m,x)=>{ m[weekKey(x.date)]=1; return m; },{})).length;
  return fn({sessionsInPhase:inPhase.length, weeksInPhase:weeks, n:want});
}
function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = (x.getDay()+6)%7;
  x.setDate(x.getDate()-day);
  return x.getTime();
}
function weekKey(ts){ return mondayOf(new Date(ts)); }
function sessionsThisWeek(){
  const wk = mondayOf(new Date());
  return S.sessions.filter(s=>weekKey(s.date)===wk).length;
}
function weeksLanded(){
  const m = {};
  S.sessions.forEach(x=>{ const k=weekKey(x.date); m[k]=(m[k]||0)+1; });
  return Object.values(m).filter(n=>n>=weeklyGoal()).length;
}
function phaseSessionCount(p){
  return S.sessions.filter(s=>s.programId===S.activeProgram && s.phase===p).length;
}
function fmtClock(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}
function fmtDate(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+"/"+d.getDate();
}
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Adaptive targets. The program picks the strategy; the app supplies the facts
   and clamps the result. Runs on save, against the active program only. */
function adapt(session){
  const rec0 = PS();
  const strat = P.progression;
  const fn = PROGRESSION[strat.strategy] || PROGRESSION["linear-step"];
  const params = strat.params || {};
  if(!rec0.streaks) rec0.streaks = {};

  session.exercises.forEach(rec=>{
    const e = EX[rec.id];
    if(!e || e.step===0) return;
    const done = rec.sets.filter(v=>v!=null);
    if(!done.length) return;
    const cur = targetFor(rec.id);
    const needed = setsFor(rec.id,false);
    const streak = rec0.streaks[rec.id] || 0;

    const next = fn({ex:e, cur, done, needed, feel:session.feel, hurt:session.hurt, params, streak});
    if(next == null) return;

    const clean = done.length >= needed && done.every(v=>v>=cur) && session.feel!=="tough" && !session.hurt;
    rec0.streaks[rec.id] = clean ? (next>cur ? 0 : streak+1) : 0;
    rec0.targets[rec.id] = Math.max(e.base, Math.min(e.max, next));
  });
}

/* Program badges score only their own program's sessions and are stored
   namespaced, so two programs can both define "first-week" without colliding. */
function programBadgeContext(){
  const mine = S.sessions.filter(s=>s.programId===S.activeProgram);
  const m = {};
  mine.forEach(x=>{ const k=weekKey(x.date); m[k]=(m[k]||0)+1; });
  return {
    sessions: mine,
    weeksLanded: Object.values(m).filter(n=>n>=weeklyGoal()).length,
    phaseIds: PHASES.map(p=>p.id),
    phaseIndex: curPhase(),
    checklist: CHECKLIST,
    checked: checklistState(),
    targets: targetsMap(),
    jumps: S.jumps
  };
}
function awardBadges(){
  BADGES.forEach(b=>{ if(!S.badges.includes(b.id) && b.test()) S.badges.push(b.id); });
  if(!P || !P.badges.length) return;
  const ctx = programBadgeContext();
  P.badges.forEach(b=>{
    const key = S.activeProgram+":"+b.id;
    if(S.badges.includes(key)) return;
    const fn = BADGE_RULES[b.rule.type];
    try{ if(fn && fn(ctx, b.rule.params||{})) S.badges.push(key); }
    catch(e){ /* a malformed rule must never break saving a session */ }
  });
}

/* ============ MOTION SENSORS ============ */
const G = 9.80665;

function motionSupported(){ return typeof window.DeviceMotionEvent !== "undefined"; }
function needsPermission(){
  return motionSupported() && typeof DeviceMotionEvent.requestPermission === "function";
}
async function askMotion(){
  if(!motionSupported()) return "unsupported";
  if(!needsPermission()) return "granted";
  try{
    const r = await DeviceMotionEvent.requestPermission();
    return r === "granted" ? "granted" : "denied";
  }catch(e){ return "denied"; }
}

/* Records raw accelerometer magnitude while running. In free fall the phone
   reads close to zero g, so a jump shows up as a dip in |a|. */
function makeRecorder(){
  const samples=[];
  let started=0, live=false;
  function onMotion(ev){
    const a = ev.accelerationIncludingGravity;
    if(!a || a.x==null) return;
    const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
    samples.push({t: performance.now()-started, m: mag});
  }
  function onGyro(ev){
    const r = ev.rotationRate;
    if(!r) return;
    const w = Math.sqrt((r.alpha||0)**2 + (r.beta||0)**2 + (r.gamma||0)**2);
    samples.push({t: performance.now()-started, w});
  }
  return {
    start(mode){
      samples.length=0; started=performance.now(); live=true;
      window.addEventListener("devicemotion", mode==="gyro"?onGyro:onMotion);
      this._h = mode==="gyro"?onGyro:onMotion;
    },
    stop(){
      if(!live) return samples;
      live=false;
      window.removeEventListener("devicemotion", this._h);
      return samples;
    },
    samples(){ return samples; }
  };
}

/* Pull flight windows out of the trace and convert to height. */
function analyseJumps(samples){
  const FLOOR = 3.0;          // m/s^2 — below this we call it airborne
  const MIN_MS = 150, MAX_MS = 900;
  const out=[];
  let inAir=false, t0=0;
  for(const s of samples){
    if(s.m==null) continue;
    if(!inAir && s.m < FLOOR){ inAir=true; t0=s.t; }
    else if(inAir && s.m >= FLOOR){
      inAir=false;
      const dt = s.t - t0;
      if(dt>=MIN_MS && dt<=MAX_MS){
        const t = dt/1000;
        const cm = Math.round((G*t*t/8)*100);
        if(cm>=3 && cm<=100) out.push({ms:Math.round(dt), cm});
      }
    }
  }
  return out;
}

/* Steadiness from rotation rate: less wobble, higher score. */
function analyseBalance(samples){
  const w = samples.map(s=>s.w).filter(v=>v!=null);
  if(w.length < 15) return null;
  const rms = Math.sqrt(w.reduce((a,v)=>a+v*v,0)/w.length);   // deg/s
  const score = Math.round(100 * Math.max(0, Math.min(1, 1 - rms/40)));
  return {score, rms:Math.round(rms*10)/10};
}

/* ============ AUDIO / HAPTIC ============ */
let actx=null;
function beep(freq=880,ms=180){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value=freq; o.type="sine";
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000+.02);
  }catch(e){}
}
function buzz(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){} }

/* ============ TIMER ============ */
function stopTimer(){
  if(timer.id) clearInterval(timer.id);
  timer.id=null; timer.running=false;
}
function startTimer(secs, onDone){
  stopTimer();
  timer.total=secs; timer.left=secs; timer.running=true; timer.onDone=onDone;
  paintClock();
  timer.id = setInterval(()=>{
    timer.left--;
    if(timer.left<=3 && timer.left>0) beep(660,90);
    if(timer.left<=0){
      stopTimer();
      beep(1046,420); buzz([120,80,120]);
      paintClock();
      onDone && onDone();
      return;
    }
    paintClock();
  },1000);
}
function paintClock(){
  const el=document.getElementById("clock");
  if(!el) return;
  el.textContent = fmtClock(Math.max(0,timer.left));
  el.classList.toggle("go", timer.running);
  const b=document.getElementById("tBtn");
  if(b) b.textContent = timer.running ? "Pause" : (timer.left>0 && timer.left<timer.total ? "Resume" : "Start");
}

    view$().innerHTML=`

      <div class="eyebrow">${counting?"Get ready":"Jump now"}</div>
      <div class="clock mono" id="clock" style="font-size:64px;margin:14px 0;color:var(--accent)">${fmtClock(Math.max(0,timer.left))}</div>
      <p class="sub" style="margin:0">${counting?"Phone tucked in, stand tall.":`Three max jumps. Detected so far: <b class="mono">${jt.found.length}</b>`}</p>
      <button class="btn ghost wide" id="cancel" style="margin-top:18px">Cancel</button>
    </div>`;
    document.getElementById("cancel").onclick=endJump;
    return;
  }

  if(jt.phase==="done"){
    const list = jt.found;
    const best = list.length ? Math.max(...list.map(j=>j.cm)) : 0;
    view$().innerHTML=`
    <div class="card">
      <h2>${list.length?"Result":"Nothing detected"}</h2>
      ${list.length?`
        <div class="target"><b>${best} cm</b><span>best of ${list.length}</span></div>
        <div class="sets">${list.map((j,i)=>`<div class="set ${j.cm===best?"on":""}">

          <div class="unit mono">${j.cm} cm · ${j.ms} ms hang</div></div>`).join("")}</div>
        <p class="sub" style="margin:12px 0 0">Good to about a centimetre or two. Compare across months, not days — this bounces around depending on how fresh your legs are.</p>
        <button class="btn wide" id="save" style="margin-top:14px">Save ${best} cm</button>
      `:`
        <p class="sub" style="margin:6px 0 0">No clean jumps came through. Usually the phone wasn't snug enough, or the jumps were too small to register. Try again with it tucked tighter.</p>
      `}
      <button class="btn quiet wide" id="again" style="margin-top:8px">Try again</button>
      <button class="btn ghost wide" id="bk2" style="margin-top:8px">Back to Today</button>
    </div>`;
    const sv=document.getElementById("save");
    if(sv) sv.onclick=()=>{
      S.jumps.push({date:Date.now(),cm:best,all:list.map(j=>j.cm)});
      awardBadges(); save(); jt.phase="idle"; jt.found=[]; view="today"; render();
    };
    document.getElementById("again").onclick=()=>{ jt.phase="idle"; jt.found=[]; renderJump(); };
    document.getElementById("bk2").onclick=()=>{ jt.phase="idle"; jt.found=[]; view="today"; render(); };
    return;
  }
}

async function beginJump(){
  const perm = await askMotion();
  if(perm!=="granted"){
    alert(perm==="unsupported"
      ? "This device or browser doesn't share motion data with web pages, so the jump test can't run here. Everything else in the app works fine."
      : "Motion access was turned down, so the jump test can't run. You can re-enable it in your browser's site settings.");
    return;
  }
  jt.phase="count"; jt.found=[];
  renderJump();
  startTimer(5, ()=>{
    jt.phase="rec";
    jt.rec = makeRecorder();
    jt.rec.start("accel");
    beep(1046,300); buzz(200);
    renderJump();
    startTimer(20, endJump);
    jt.tid = setInterval(()=>{
      if(jt.phase!=="rec") return;
      const found = analyseJumps(jt.rec.samples());
      if(found.length !== jt.found.length){
        jt.found = found;
        const el=view$().querySelector(".sub b");
        if(el) el.textContent = found.length;
        if(found.length>=3){ endJump(); }
      }
    }, 400);
  });
}

function endJump(){
  stopTimer();
  if(jt.tid){ clearInterval(jt.tid); jt.tid=null; }
  if(jt.rec){ jt.found = analyseJumps(jt.rec.stop()); jt.rec=null; }
  jt.phase="done";
  beep(660,200);
  renderJump();
}

  <div class="card">
    <div class="meter">

          <circle class="track" cx="66" cy="66" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fill" cx="66" cy="66" r="${R}" fill="none" stroke-width="9"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/>

  </div>`}`;

function jumpPrompt(){
  const last = S.jumps[S.jumps.length-1];
  if(!last) return "Set a starting number so you have something to beat later.";
  const days = Math.floor((Date.now()-last.date)/86400000);
  if(days < 6) return `Last test was ${last.cm} cm, ${days===0?"today":days===1?"yesterday":days+" days ago"}. Once a week is plenty — daily numbers just bounce around.`;
  return `Last test was ${last.cm} cm, ${days} days ago. Good time for another.`;
}

/* ---- SESSION WIZARD ---- */
function renderSession(){
  const A=S.active;
  const total=A.exercises.length;
  if(step>=total) return renderFinish();

  const rec=A.exercises[step];
  const e=EX[rec.id];
  const nSets=setsFor(rec.id,A.heavy);
  const tgt=targetFor(rec.id);
  const isHold=e.mode==="hold";

  view$().innerHTML=`
  <div class="stepbar">${A.exercises.map((_,i)=>`<span class="${i<step?"done":i===step?"now":""}"></span>`).join("")}</div>
  <div class="card">
    <h2 class="exname">${e.name}</h2>
    <p class="why">${e.why}</p>
    <ol class="how">${e.how.map(h=>`<li>${h}</li>`).join("")}</ol>
    <div class="tips"><p>Form notes</p><ul>${e.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>

    <div class="target">
      <b>${isHold?fmtClock(tgt):tgt}</b>
      <span>${isHold?"per hold":"reps"}${e.perSide?" · each side":""} · ${nSets} ${nSets===1?"set":"sets"}</span>
    </div>

    ${isHold?`<div class="timer">
      <div class="clock" id="clock">${fmtClock(tgt)}</div>
      <div class="ctl">
        <button class="btn sm" id="tBtn">Start</button>
        <button class="btn sm ghost" id="tReset">Reset</button>
      </div>
    </div>`:""}

    <div class="sets">${Array.from({length:nSets},(_,i)=>setRow(rec,i,tgt,isHold,e.perSide)).join("")}</div>

    ${rec.id==="warmup"||rec.id==="cooldown"?"":`
    <div class="timer" style="margin-top:14px">
      <div class="sub" style="margin-bottom:8px">Rest between sets</div>
      <button class="btn sm quiet" id="rest">Rest 60s</button>
    </div>`}
  </div>

  <div class="nav2">
    <button class="btn ghost" id="back">${step===0?"Quit":"Back"}</button>
    <button class="btn" id="next">${step===total-1?"Finish up":"Next"}</button>
  </div>`;

  // set rows
  view$().querySelectorAll("[data-set]").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.set;
      const inp=document.getElementById("v"+i);
      if(rec.sets[i]!=null){ rec.sets[i]=null; }
      else { rec.sets[i]= inp? (+inp.value||tgt) : tgt; }
      save(); renderSession();
    };
  });

  if(isHold){
    const wantBalance = S.measure.on && e.balanceScore;
    let brec=null;
    const reset=()=>{ stopTimer(); if(brec){brec.stop();brec=null;} timer.left=tgt; timer.total=tgt; paintClock(); };
    reset();
    document.getElementById("tBtn").onclick=async()=>{
      if(timer.running){ stopTimer(); if(brec){brec.stop();brec=null;} paintClock(); return; }
      const from = (timer.left>0 && timer.left<timer.total) ? timer.left : tgt;
      timer.total = tgt;
      if(wantBalance && !brec){
        const perm = await askMotion();
        if(perm==="granted"){ brec = makeRecorder(); brec.start("gyro"); }
      }
      startTimer(from, ()=>{
        let bal=null;
        if(brec){ bal = analyseBalance(brec.stop()); brec=null; }
        const i=rec.sets.findIndex(v=>v==null);
        const idx = i>=0 ? i : rec.sets.length;
        if(idx<nSets){
          rec.sets[idx]=tgt;
          if(bal){ rec.balance = rec.balance||[]; rec.balance[idx]=bal.score; }
          save(); renderSession();
        }
      });
    };
    document.getElementById("tReset").onclick=reset;
  }
  const rb=document.getElementById("rest");
  if(rb) rb.onclick=()=>{ rb.disabled=true; startTimer(60,()=>{ rb.disabled=false; rb.textContent="Rest 60s"; });
    const t=setInterval(()=>{ if(!timer.running){clearInterval(t); return;} rb.textContent="Rest "+fmtClock(timer.left); },250); };

  document.getElementById("back").onclick=()=>{
    stopTimer();
    if(step===0){
      if(confirm("Quit this session? Nothing will be saved.")){ S.active=null; save(); render(); }
      return;
    }
    step--; renderSession(); window.scrollTo(0,0);
  };
  document.getElementById("next").onclick=()=>{ stopTimer(); step++; renderSession(); window.scrollTo(0,0); };
}

function setRow(rec,i,tgt,isHold,perSide){
  const on = rec.sets[i]!=null;
  const val = on ? rec.sets[i] : tgt;
  const bal = rec.balance && rec.balance[i]!=null ? rec.balance[i] : null;
  return `<div class="set ${on?"on":""}">
    <div class="n">Set ${i+1}</div>
    ${isHold
      ? `<div class="unit mono">${fmtClock(val)}${perSide?" each side":""}${bal!=null?` · steady ${bal}`:""}</div>`
      : `<input id="v${i}" type="number" inputmode="numeric" min="0" value="${val}" ${on?"disabled":""} aria-label="Reps for set ${i+1}">
         <div class="unit">reps${perSide?" each side":""}</div>`}
    <button class="tick" data-set="${i}" aria-label="${on?"Undo":"Log"} set ${i+1}">${on?"✓":"+"}</button>
  </div>`;
}

/* ---- FINISH ---- */
let draft={feel:null,notes:"",hurt:false};
function renderFinish(){
  const A=S.active;
  const logged=A.exercises.reduce((n,r)=>n+r.sets.filter(v=>v!=null).length,0);
  view$().innerHTML=`
  <div class="card">
    <h2>Session done</h2>
    <p class="sub" style="margin:6px 0 0">${logged} ${logged===1?"set":"sets"} logged${A.heavy?" · heavy ice week":""}.</p>
  </div>
  <div class="card">
    <h2>How did it feel?</h2>
    <div class="feels" style="margin-top:12px">
      ${[["easy","😌","Easy"],["good","🙂","Just right"],["tough","😮‍💨","Tough"]].map(([k,e,l])=>
        `<button data-feel="${k}" class="${draft.feel===k?"on":""}"><span class="e">${e}</span><span class="l">${l}</span></button>`).join("")}
    </div>
    <textarea id="notes" placeholder="Anything you want to remember? What felt strong, what was wobbly…">${esc(draft.notes)}</textarea>
    <div class="row" style="margin-top:8px">
      <div>
        <div class="lbl">Something hurt</div>
        <div class="sub">Not muscle burn — actual pain.</div>
      </div>
      <button class="switch" id="hurt" role="switch" aria-checked="${draft.hurt}" aria-label="Something hurt"><i></i></button>
    </div>
    ${draft.hurt?`<div class="notice">Stop doing that exercise for now, and tell your parent or coach before your next session. This gets flagged in your history so it doesn't get forgotten.</div>`:""}
    <button class="btn wide" id="save" style="margin-top:16px">Save session</button>
    <button class="btn ghost wide" id="discard" style="margin-top:8px">Discard</button>
  </div>`;

  view$().querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{ draft.feel=b.dataset.feel; renderFinish(); });
  const h=document.getElementById("hurt");
  h.onclick=()=>{ draft.notes=document.getElementById("notes").value; draft.hurt=!draft.hurt; renderFinish(); };
  document.getElementById("save").onclick=()=>{
    const A=S.active;
    A.notes=document.getElementById("notes").value.trim();
    A.feel=draft.feel||"good";
    A.hurt=draft.hurt;
    A.exercises=A.exercises.filter(r=>r.sets.some(v=>v!=null));
    adapt(A);
    S.sessions.push(A);
    S.active=null;
    /* advance the day variant for phases that rotate */
    const ph = currentPhase();
    if(ph.days.length>1 && ph.rotate==="sequential")
      PS().dayIndex = ((PS().dayIndex||0)+1) % ph.days.length;
    awardBadges();
    draft={feel:null,notes:"",hurt:false};
    step=0; save(); render();
  };
  document.getElementById("discard").onclick=()=>{
    if(confirm("Discard this session?")){ S.active=null; draft={feel:null,notes:"",hurt:false}; step=0; save(); render(); }
  };
}

/* ---- PROGRAM ---- */
function renderProgram(){
  view$().innerHTML = PHASES.map(p=>`
    <div class="phase-h">
      <h2>${p.name}</h2>
      <span class="pill ${p.n===curPhase()?"live":""}">${p.n===curPhase()?"Current":p.weeks}</span>
    </div>
    <p class="sub" style="margin:0 0 12px">${p.blurb}</p>
    ${p.plan.filter(id=>id!=="warmup"&&id!=="cooldown").map(id=>{
      const e=EX[id],t=targetFor(id);
      return `<button class="exrow" data-ex="${id}">
        <b>${e.name}</b>
        <span class="t">${e.mode==="hold"?fmtClock(t):t+"×"+e.sets}</span>
      </button>`;
    }).join("")}
  `).join("");
  view$().querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>showEx(b.dataset.ex));
}
function showEx(id){
  const e=EX[id];
  view$().innerHTML=`
  <button class="btn ghost sm" id="bk" style="margin-bottom:14px">← Program</button>
  <div class="card">
    <h2 class="exname">${e.name}</h2>
    <p class="why">${e.why}</p>
    <ol class="how">${e.how.map(h=>`<li>${h}</li>`).join("")}</ol>
    <div class="tips"><p>Form notes</p><ul>${e.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <div class="target"><b>${e.mode==="hold"?fmtClock(targetFor(id)):targetFor(id)}</b>
      <span>${e.mode==="hold"?"per hold":"reps"}${e.perSide?" · each side":""} · ${e.sets} sets · current target</span></div>
  </div>`;
  document.getElementById("bk").onclick=()=>renderProgram();
  window.scrollTo(0,0);
}

/* ---- PROGRESS ---- */
function renderProgress(){
  const recent=S.sessions.slice(-20).reverse();
  view$().innerHTML=`
  ${S.jumps.length?`<div class="card">
    <h2>Jump height</h2>
    ${jumpChart()}
  </div>`:""}

  <div class="card">
    <h2>Badges</h2>
    <div class="badges" style="margin-top:12px">
      ${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"got":""}">
        <div class="ic">${b.ic}</div><div class="nm">${b.nm}</div></div>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Jump readiness</h2>
    <p class="sub" style="margin:6px 0 6px">Tick these off as they become true. All seven means you're strong enough for harder jump work.</p>
    ${CHECKLIST.map(c=>`<button class="check ${checklistState()[c.id]?"on":""}" data-ck="${c.id}">
      <span class="box">${checklistState()[c.id]?"✓":""}</span><span class="tx">${esc(c.t)}</span></button>`).join("")}
  </div>

  <div class="card">
    <h2>History</h2>
    ${recent.length?recent.map(histRow).join(""):`<p class="sub" style="margin:6px 0 0">Nothing logged yet. Your first session will show up here.</p>`}
    ${S.sessions.length>20?`<p class="sub" style="margin:12px 0 0">Showing the last 20 of ${S.sessions.length}.</p>`:""}
  </div>`;

  view$().querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.ck;
    checklistState()[id]=!checklistState()[id];
    awardBadges(); save(); renderProgress();
  });
}
function jumpChart(){
  const js = S.jumps.slice(-14);
  const max = Math.max(...js.map(j=>j.cm));
  const min = Math.min(...js.map(j=>j.cm));
  const first = js[0].cm, last = js[js.length-1].cm;
  const W=100, H=42, pad=3;
  const span = Math.max(1, max-min);
  const pts = js.map((j,i)=>{
    const x = js.length===1 ? W/2 : pad + i*(W-2*pad)/(js.length-1);
    const y = H-pad - ((j.cm-min)/span)*(H-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const delta = last-first;
  return `
  <div class="target"><b>${last} cm</b><span>most recent${js.length>1?` · ${delta>=0?"+":""}${delta} cm since ${fmtDate(js[0].date)}`:""}</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:96px;display:block;margin:6px 0 4px" aria-hidden="true">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6" fill="var(--edge)"/>`).join("")}
  </svg>
  <p class="sub" style="margin:0">${js.length} test${js.length===1?"":"s"} · range ${min}–${max} cm. Day-to-day swings are normal; look at the shape over months.</p>`;
}

function histRow(s){
  const sets=s.exercises.reduce((n,r)=>n+r.sets.filter(v=>v!=null).length,0);
  const face={easy:"😌",good:"🙂",tough:"😮‍💨"}[s.feel]||"🙂";
  return `<div class="hist">
    <div class="d">${fmtDate(s.date)}</div>
    <div class="b">Phase ${s.phase} · ${sets} sets${s.heavy?" · heavy ice":""}
      ${s.hurt?`<div class="flagged">⚠ Flagged: something hurt</div>`:""}
      ${s.notes?`<div class="sub" style="margin-top:3px">${esc(s.notes)}</div>`:""}
    </div>
    <div class="feel">${face}</div>
  </div>`;
}

/* ---- SETTINGS ---- */
function importCode(){
  const code=window.prompt("Paste the backup code:");
  if(!code) return false;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data || !Array.isArray(data.sessions)) throw 0;
    if(S.sessions.length && !confirm(`This will replace what's on this device (${S.sessions.length} sessions) with the code's ${data.sessions.length}. Continue?`)) return false;
    S=hydrate(data);
    S.active=null; S.setupDone=true;
    refreshProgram();
    save(); view="today"; render();
    return true;
  }catch(e){
    alert("That code didn't read correctly. Copy it again from the other device — it needs to be the whole thing.");
    return false;
  }
}

function renderSettings(){
  view$().innerHTML=`
  <div class="card">
    <h2>Skater</h2>
    <p class="sub" style="margin:6px 0 12px">Used for the greeting on the Today screen.</p>
    <input id="pname" class="field" type="text" maxlength="24" autocomplete="off" placeholder="Your name"
      value="${esc(S.profile.name||"")}" aria-label="Skater name">
    <button class="btn quiet wide" id="saveName" style="margin-top:10px">Save name</button>
  </div>

  <div class="card">
    <h2>Theme</h2>
    <div class="badges" style="margin-top:12px">
      ${THEMES.map(([k,n])=>`<button class="badge ${S.theme===k?"got":""}" data-th="${k}" style="opacity:1">
        <div class="ic">◐</div><div class="nm">${n}</div></button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Sessions per week</h2>
    <p class="sub" style="margin:6px 0 12px">This is what fills the rotation meter. Three is plenty alongside ice time.</p>
    <div class="feels">
      ${[3,4].map(n=>`<button data-goal="${n}" class="${weeklyGoal()===n?"on":""}">
        <span class="e mono">${n}</span><span class="l">per week</span></button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Measure mode</h2>
    <p class="sub" style="margin:6px 0 4px">Uses the phone's motion sensors to measure your jump height and how steady your single-leg holds are. Off by default.</p>
    <div class="row" style="margin-top:8px">
      <div>
        <div class="lbl">Turn on measuring</div>
        <div class="sub">${motionSupported()?"Your phone will ask permission the first time.":"This device doesn't share motion data with web pages."}</div>
      </div>
      <button class="switch" id="meas" role="switch" aria-checked="${S.measure.on}" aria-label="Measure mode" ${motionSupported()?"":"disabled style=opacity:.4"}><i></i></button>
    </div>
    ${S.measure.on?`<div class="notice">This measures, it doesn't police. The numbers are only worth having if they're real ones — and it works best on a phone, not a laptop.</div>`:""}
  </div>

  <div class="card">
    <h2>Move between devices</h2>
    <p class="sub" style="margin:6px 0 12px">Your history lives in this browser only. Copy a backup code here, paste it on the other device.</p>
    <button class="btn wide" id="copy">Copy backup code</button>
    <button class="btn quiet wide" id="paste" style="margin-top:8px">Paste backup code</button>
    <p class="sub" style="margin:12px 0 0">${S.sessions.length} sessions stored.</p>
  </div>

  <div class="card">
    <h2>Phase</h2>
    <p class="sub" style="margin:6px 0 12px">Currently Phase ${curPhase()}. Move down anytime if the work stops feeling controlled.</p>
    <div class="feels">
      ${PHASES.map(p=>`<button data-ph="${p.n}" class="${curPhase()===p.n?"on":""}">
        <span class="e mono">${p.n}</span><span class="l">${esc(p.name)}</span></button>`).join("")}
    </div>
  </div>

  <div class="card">
    <h2>Start over</h2>
    <p class="sub" style="margin:6px 0 12px">Erases every session, badge, and target on this device.</p>
    <button class="btn ghost wide" id="wipe">Erase everything</button>
  </div>

  <div class="card">
    <p class="sub" style="margin:0">This is general training guidance, not medical or coaching advice. Volume and jump work should be cleared with a skating coach or a trainer who works with young athletes — especially during a growth spurt.</p>
  </div>`;

  view$().querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.theme=b.dataset.th; save(); render(); });
  view$().querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ S.weeklyGoalOverride=+b.dataset.goal; save(); renderSettings(); });
  view$().querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{ setPhase(+b.dataset.ph); awardBadges(); save(); render(); });

  document.getElementById("copy").onclick=async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{
      await navigator.clipboard.writeText(code);
      alert("Backup code copied. Paste it into the other device.");
    }catch(e){
      window.prompt("Copy this code:", code);
    }
  };
  const mb=document.getElementById("meas");
  if(mb && motionSupported()) mb.onclick=async()=>{
    if(!S.measure.on){
      const perm = await askMotion();
      if(perm!=="granted"){
        alert(perm==="unsupported"
          ? "This device doesn't share motion data with web pages."
          : "Motion access was turned down. You can change it in your browser's site settings and try again.");
        return;
      }
    }
    S.measure.on=!S.measure.on; S.measure.seen=true; save(); renderSettings();
  };

  document.getElementById("paste").onclick=()=>importCode();

  const pn=document.getElementById("pname");
  const saveName=()=>{
    S.profile.name = pn.value.trim();
    save();
    const b=document.getElementById("saveName");
    b.textContent="Saved"; setTimeout(()=>{ b.textContent="Save name"; },1200);
  };
  document.getElementById("saveName").onclick=saveName;
  pn.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); saveName(); } };
  document.getElementById("wipe").onclick=()=>{
    if(!confirm("Erase all sessions and progress on this device?")) return;
    if(!confirm("Last check — this can't be undone.")) return;
    S=ensurePrograms(blank()); refreshProgram(); save(); view="today"; render();
  };
}

/* ============ BOOT ============ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  if(S.active && !confirm("You have a session in progress. Leave it?")) return;
  if(S.active){ S.active=null; step=0; save(); }
  stopTimer(); view=b.dataset.go; render();
});
refreshProgram();
/* self-check: a built-in that doesn't satisfy its own format is a bug, and the
   authoring skill is told to imitate it. Loud in the console, harmless in use. */
BUILTIN_PROGRAMS.forEach(def=>{
  const r = validateProgram(def);
  if(!r.ok) console.error("Built-in program "+def.id+" fails validation:", r.errors);
});
awardBadges();
render();
</script>
